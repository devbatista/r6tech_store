test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Produção: bucket privado no S3; o Active Storage gera URLs assinadas de curta duração.
# Credenciais em `credentials` (aws.s3.*) ou nas variáveis AWS_*; quando nenhuma das duas
# existir, o SDK usa a cadeia padrão (IAM role da instância/container).
# O bucket precisa de CORS para o upload direto do formulário de produto (ver README).
<%
  s3 = Rails.application.credentials.dig(:aws, :s3) || {}
  s3_access_key_id = s3[:access_key_id] || ENV["AWS_ACCESS_KEY_ID"]
  s3_secret_access_key = s3[:secret_access_key] || ENV["AWS_SECRET_ACCESS_KEY"]
%>
amazon:
  service: S3
  region: <%= s3[:region] || ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= s3[:bucket] || ENV.fetch("AWS_S3_BUCKET", "r6tech-store-#{Rails.env}") %>
<% if s3_access_key_id.present? && s3_secret_access_key.present? %>
  access_key_id: <%= s3_access_key_id %>
  secret_access_key: <%= s3_secret_access_key %>
<% end %>
  upload:
    cache_control: "private, max-age=31536000"
